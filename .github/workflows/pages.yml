name: Deploy to GitHub Pages

# One Pages site, two builds: `main` (the players' game) at the root, and `dev` (everything
# unlocked, nothing saved; see src/core/channel.ts) under /dev/. A push to either branch
# rebuilds both, so neither ever replaces the other. Keep this file the same on both branches.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.devbuild.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The players' build: checked as before.
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npx vite build
      # The dev build, if the branch exists: tested too, but a failure there never blocks main.
      - name: Check out dev
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - name: Build dev
        id: devbuild
        if: steps.dev.outcome == 'success'
        continue-on-error: true
        working-directory: dev
        env:
          VITE_CHANNEL: dev
        run: |
          npm ci
          npm run typecheck
          npm test
          npx vite build
          mkdir -p ../main/dist/dev
          cp -r dist/. ../main/dist/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A failed dev build never blocks the players' deploy, but it must not hide either: the run
  # turns red here (after main is live). The site is replaced whole, so /dev/ is missing until
  # the dev build passes again.
  dev-status:
    needs: [build, deploy]
    if: always() && needs.build.outputs.dev == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The dev build failed (see the build job's 'Build dev' step), so /dev/ is not on the site. The players' build deployed as usual."
          exit 1
